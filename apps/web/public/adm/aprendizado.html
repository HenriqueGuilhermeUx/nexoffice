<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>NexOffice · Aprendizado da Inteligência</title>
  <link rel="stylesheet" href="/adm/styles.css"/>
  <style>
    .learnTop{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.learnTop h1{margin:0}.learnTop p{margin:4px 0 0;color:#666}.learnGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.learnCard{background:#fff;border:1px solid #e2e2dc;border-radius:16px;padding:16px}.learnCard small{color:#666}.learnCard b{display:block;font-size:26px;margin-top:5px}.learnActions{display:flex;gap:7px;flex-wrap:wrap}.sbtn{border:1px solid #d5d5cf;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:12px}.sbtn.apply{background:#e7f4ea;color:#23623a;border-color:#cce5d2}.sbtn.dismiss{background:#f4f4f1;color:#555}.status{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;background:#eee}.status.improved{background:#e7f4ea;color:#23623a}.status.worsened{background:#fde8e8;color:#9c2c2c}.status.stable{background:#fff4d4;color:#846307}.status.waiting{background:#eef2f7;color:#42526b}.guard{background:#eef5ff;border:1px solid #cdddf2;padding:12px 14px;border-radius:12px;margin-bottom:15px}@media(max-width:1100px){.learnGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.learnGrid{grid-template-columns:1fr 1fr}.learnTop{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="content" style="max-width:1500px;margin:auto"><div id="learn"><div class="loading">Carregando aprendizado da inteligência…</div></div></main>
  <script src="/adm/aprendizado.js" defer></script>
</body>
</html>
