<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>NexOffice · Laboratório de Inteligência</title>
  <link rel="stylesheet" href="/adm/styles.css"/>
  <style>
    .labTop{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.labTop h1{margin:0}.labTop p{margin:4px 0 0;color:#666}.labGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.labCard{background:#fff;border:1px solid #e2e2dc;border-radius:16px;padding:16px}.labCard small{color:#666}.labCard b{display:block;font-size:26px;margin-top:5px}.labActions{display:flex;gap:6px;flex-wrap:wrap}.vbtn{border:1px solid #d5d5cf;background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:12px}.vbtn.ok{background:#e7f4ea;color:#23623a;border-color:#cce5d2}.vbtn.partial{background:#fff4d4;color:#846307;border-color:#eadcae}.vbtn.no{background:#fde8e8;color:#9c2c2c;border-color:#efc4c4}.tag{display:inline-block;border-radius:999px;padding:3px 7px;background:#eee;font-size:11px}.labHeaderLink{text-decoration:none;color:#111;border:1px solid #d5d5cf;background:#fff;border-radius:9px;padding:9px 12px}.progress{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#222}.warn{background:#fff9e8;border:1px solid #eadcae;padding:11px 13px;border-radius:12px;margin-bottom:15px}@media(max-width:1000px){.labGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.labGrid{grid-template-columns:1fr}.labTop{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="content" style="max-width:1500px;margin:auto">
    <div id="lab"><div class="loading">Carregando Laboratório de Inteligência…</div></div>
  </main>
  <script src="/adm/laboratorio.js" defer></script>
</body>
</html>
