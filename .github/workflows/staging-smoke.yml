name: Staging Smoke

on:
  push:
    branches:
      - staging-smoke-20260915

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for NexOffice staging health
        env:
          STAGING_URL: https://nexoffice-staging-api.onrender.com
        run: |
          node <<'NODE'
          const base=process.env.STAGING_URL;
          let last='';
          for(let i=0;i<24;i++){
            try{
              const r=await fetch(base+'/health');
              last=await r.text();
              if(r.ok){console.log(last);process.exit(0)}
            }catch(e){last=String(e)}
            await new Promise(r=>setTimeout(r,5000));
          }
          console.error('staging health unavailable:',last);
          process.exit(1);
          NODE
      - name: Run full operational smoke against staging
        env:
          SMOKE_API_URL: https://nexoffice-staging-api.onrender.com
        run: |
          cp scripts/smoke.mjs /tmp/nexoffice-staging-smoke.mjs
          RUN_ID="${{ github.run_id }}"
          sed -i "s/smoke@nexoffice.test/smoke-${RUN_ID}@nexoffice.test/g" /tmp/nexoffice-staging-smoke.mjs
          sed -i "s/member@nexoffice.test/member-${RUN_ID}@nexoffice.test/g" /tmp/nexoffice-staging-smoke.mjs
          node /tmp/nexoffice-staging-smoke.mjs
