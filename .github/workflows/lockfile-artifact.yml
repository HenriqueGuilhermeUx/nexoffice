name: Lockfile Artifact

on:
  push:
    branches: [fix/lockfile-determinism]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lockfile-determinism
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add deterministic npm lockfile"
            git push origin HEAD:fix/lockfile-determinism
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nexoffice-package-lock
          path: package-lock.json
          if-no-files-found: error
