name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Audit dependencies for high severity vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build
      - name: Smoke test PowerPoint export dependency
        run: node scripts/smoke-pptxgen.mjs
      - name: Smoke test Business Catalog V1
        run: node scripts/smoke-business-catalog-v1.mjs
      - name: Smoke test Business Profitability V1
        run: node scripts/smoke-business-profitability-v1.mjs
      - name: Smoke test Recurrence Intelligence V1
        run: node scripts/smoke-recurrence-intelligence-v1.mjs
      - name: Smoke test Relationship Intelligence V1
        run: node scripts/smoke-relationship-intelligence-v1.mjs
      - name: Smoke test ERP Value Pack V1
        run: node scripts/smoke-erp-value-pack-v1.mjs
      - name: Smoke test Smart Playbooks V1
        run: node scripts/smoke-smart-playbooks-v1.mjs
      - name: Smoke test Maya Playbooks V2
        run: node scripts/smoke-maya-playbooks-v2.mjs
      - name: Smoke test Multi-Agent Playbooks V3
        run: node scripts/smoke-multi-agent-playbooks-v3.mjs
      - name: Validate staging safety contract
        env:
          NEXOFFICE_ENV: staging
          NODE_ENV: production
          NEXOFFICE_DATABASE_SCOPE: nexoffice-staging
          NEXOFFICE_EXTERNAL_ACTIONS: "false"
          DATABASE_URL: postgresql://nexoffice:ci@dedicated-nexoffice-staging.internal:5432/nexoffice_staging
          NEXOFFICE_INTERNAL_KEY: ci-staging-internal-key-0123456789abcdef
          WEB_APP_URL: https://staging.nexoffice.example.test
          ALLOWED_ORIGINS: https://staging.nexoffice.example.test
        run: |
          node scripts/check-staging-readiness.mjs
          if NEXOFFICE_EXTERNAL_ACTIONS=true node scripts/check-staging-readiness.mjs; then
            echo "staging gate incorrectly allowed external actions"
            exit 1
          fi
          if DATABASE_URL=postgresql://user:pass@nexa-wallet-v15-staging-db.internal:5432/nexa node scripts/check-staging-readiness.mjs; then
            echo "staging gate incorrectly allowed Nexa database reuse"
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexoffice
          POSTGRES_USER: nexoffice
          POSTGRES_PASSWORD: nexoffice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexoffice -d nexoffice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexoffice:nexoffice@127.0.0.1:5432/nexoffice
      DATABASE_SSL: "false"
      PORT: "4000"
      ALLOWED_ORIGINS: "*"
      WEB_APP_URL: http://localhost:5173
      NEXOFFICE_EXTERNAL_ACTIONS: "false"
      NEXOFFICE_INTERNAL_KEY: "platform-smoke-key"
      NEXOFFICE_ADMIN_EMAILS: "admin-smoke@nexoffice.test"
      NEXOFFICE_INTELLIGENCE_DAILY_ENGINE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - name: Apply database schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/002_platform_foundation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/003_core_operational.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/004_integration_runtime.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/005_assistant_collections.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/006_reconciliation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/007_vertical_packs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/008_platform_provisioning.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/009_federated_auth.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/010_platform_handoff.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/011_platform_member_roles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/012_health_operational_signals.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/013_billing_trial.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/014_flexible_modules_creator.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/015_financial_intelligence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/016_finance_daily_history.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/017_business_intelligence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/018_intelligence_depth.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/019_weekly_intelligence_actions.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/020_intelligence_learning_loop.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/021_intelligence_daily_engine.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/022_anonymous_benchmarks.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/028_network_and_owned_payments.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/029_business_operation_lineage.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/031_business_operation_communication.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/040_materials_studio.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/041_business_catalog.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/042_business_profitability.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/043_recurrence_intelligence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/044_erp_value_pack.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/045_smart_playbooks.sql
      - name: Start API
        run: |
          node apps/api/dist/server.js > /tmp/nexoffice-api.log 2>&1 &
          echo $! > /tmp/nexoffice-api.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexoffice-api.log
          exit 1
      - name: Smoke test operational flow
        run: node scripts/smoke.mjs
      - name: Smoke test Nex Business Graph and Maya Executive Context
        run: node scripts/smoke-business-graph-executive.mjs
      - name: Smoke test Nex Connect Center
        run: node scripts/smoke-nex-connect-center.mjs
      - name: Smoke test Workspace Context email and calendar
        run: node scripts/smoke-workspace-context.mjs
      - name: Smoke test ERP universal import
        run: node scripts/smoke-erp-connect.mjs
      - name: Smoke test Google Workspace connector security contract
        run: node scripts/smoke-google-connect-contract.mjs
      - name: Smoke test Microsoft 365 connector security contract
        run: node scripts/smoke-microsoft-connect-contract.mjs
      - name: Smoke test Recurrence Intelligence API
        run: node scripts/smoke-recurrence-intelligence-api.mjs
      - name: Smoke test Relationship Intelligence API
        run: node scripts/smoke-relationship-intelligence-api.mjs
      - name: Smoke test ERP Value Pack API
        run: node scripts/smoke-erp-value-pack-api.mjs
      - name: Smoke test Smart Playbooks API
        run: node scripts/smoke-smart-playbooks-api.mjs
      - name: Smoke test Maya Playbooks V2 API
        run: node scripts/smoke-maya-playbooks-api.mjs
      - name: Smoke test Multi-Agent Playbooks V3 API
        run: node scripts/smoke-multi-agent-playbooks-api.mjs
      - name: Smoke test standalone workspace activation
        run: node scripts/smoke-standalone-readiness.mjs
      - name: Smoke test billing trial
        run: node scripts/smoke-billing.mjs
      - name: Smoke test fiscal bridge
        run: node scripts/smoke-fiscal.mjs
      - name: Smoke test Flexible Modules and Creator pack
        run: node scripts/smoke-flexible-creator.mjs
      - name: Smoke test Financial Intelligence
        run: node scripts/smoke-financial-intelligence.mjs
      - name: Smoke test Business Radar and Intelligence Lab
        run: node scripts/smoke-business-intelligence-depth.mjs
      - name: Smoke test weekly intelligence and priority actions
        run: node scripts/smoke-intelligence-v3.mjs
      - name: Smoke test intelligence learning loop
        run: node scripts/smoke-intelligence-learning.mjs
      - name: Smoke test daily intelligence engine
        run: node scripts/smoke-intelligence-daily-engine.mjs
      - name: Smoke test anonymous sector benchmarks
        run: node scripts/smoke-anonymous-benchmark.mjs
      - name: Smoke test CSV and OFX statement import
        run: node scripts/smoke-statement-import.mjs
      - name: Smoke test AV platform provisioning
        run: node scripts/smoke-platform.mjs
      - name: Smoke test AV vertical bridge SDK
        run: node scripts/smoke-platform-sdk.mjs
      - name: Smoke test health data firewall
        run: node scripts/smoke-health-firewall.mjs
      - name: Smoke test legal data firewall
        run: node scripts/smoke-legal-firewall.mjs
      - name: Smoke test Condo Operations firewall
        run: node scripts/smoke-condo-firewall.mjs
      - name: Smoke test Commerce Operations firewall
        run: node scripts/smoke-commerce-firewall.mjs
      - name: Smoke test Commerce connector SDK
        run: node scripts/smoke-commerce-sdk.mjs
      - name: Smoke test proactive Secretary and CRM automations
        run: node scripts/smoke-proactive-automation.mjs
      - name: Smoke test Command Center domain overview
        run: node scripts/smoke-command-overview.mjs
      - name: Smoke test Digital Team role routing
        run: node scripts/smoke-digital-team.mjs
      - name: Smoke test ecosystem capability graph
        run: node scripts/smoke-capability-graph.mjs
      - name: Smoke test usage and cost analytics
        run: node scripts/smoke-usage-costs.mjs
      - name: Smoke test shared-workspace operational insights
        run: node scripts/smoke-operational-insights.mjs
      - name: API logs on failure
        if: failure()
        run: cat /tmp/nexoffice-api.log || true
