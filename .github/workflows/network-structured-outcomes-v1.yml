name: Network Structured Outcomes V1

on:
  pull_request:
    paths:
      - 'apps/api/src/routes-network-structured-outcomes.ts'
      - 'apps/api/src/routes-standalone.ts'
      - 'apps/web/src/NetworkCenter.tsx'
      - 'scripts/smoke-network-structured-outcomes-v1.mjs'
      - 'docs/NEXOFFICE_EXECUTION_PLAN.md'
      - '.github/workflows/network-structured-outcomes-v1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/routes-network-structured-outcomes.ts'
      - 'apps/api/src/routes-standalone.ts'
      - 'apps/web/src/NetworkCenter.tsx'
      - 'scripts/smoke-network-structured-outcomes-v1.mjs'
      - 'docs/NEXOFFICE_EXECUTION_PLAN.md'
      - '.github/workflows/network-structured-outcomes-v1.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build full NexOffice workspace
        run: npm run build
      - name: Validate Network structured outcomes contract
        run: node scripts/smoke-network-structured-outcomes-v1.mjs
