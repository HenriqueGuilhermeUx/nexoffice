name: TaxAgent Fiscal Governance V3 Smoke

on:
  pull_request:
    paths:
      - 'apps/api/src/routes-fiscal.ts'
      - 'apps/api/src/routes-fiscal-governance.ts'
      - 'apps/api/src/taxagent-fiscal-client.ts'
      - 'apps/api/src/integration-runtime.ts'
      - 'apps/api/src/server.ts'
      - 'apps/web/src/FiscalCenterV2.tsx'
      - 'apps/web/src/FiscalCenterV2Portal.tsx'
      - 'apps/web/src/fiscal-center-v2.css'
      - 'scripts/fake-taxagent-partner.mjs'
      - 'scripts/smoke-taxagent-fiscal-center-v2.mjs'
      - '.github/workflows/taxagent-fiscal-center-v2-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexoffice
          POSTGRES_USER: nexoffice
          POSTGRES_PASSWORD: nexoffice
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexoffice -d nexoffice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexoffice:nexoffice@127.0.0.1:5432/nexoffice
      DATABASE_SSL: 'false'
      PORT: '4000'
      ALLOWED_ORIGINS: '*'
      WEB_APP_URL: http://localhost:5173
      NEXOFFICE_EXTERNAL_ACTIONS: 'true'
      NEXOFFICE_INTERNAL_KEY: fiscal-v3-smoke-internal
      TAXAGENT_BASE_URL: http://127.0.0.1:4010
      TAXAGENT_NEXOFFICE_KEY: taxagent-partner-ci-key
      TAXAGENT_API_KEY: taxagent-partner-ci-key
      TAXAGENT_AUTH_HEADER: X-TaxAgent-NexOffice-Key
      TAXAGENT_INVOICE_PATH: /v1/partners/nexoffice/invoices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Apply schema and migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/schema.sql
          for f in $(find infra/postgres -maxdepth 1 -type f -name '0*.sql' | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Start fake TaxAgent partner
        run: |
          node scripts/fake-taxagent-partner.mjs > /tmp/fake-taxagent.log 2>&1 &
          for i in {1..20}; do
            if grep -q fake_taxagent_partner_listening /tmp/fake-taxagent.log; then break; fi
            sleep .5
          done
          cat /tmp/fake-taxagent.log
      - name: Start NexOffice API
        run: |
          node apps/api/dist/server.js > /tmp/nexoffice-api.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexoffice-api.log
          exit 1
      - name: Run Fiscal Governance V3 smoke
        run: node scripts/smoke-taxagent-fiscal-center-v2.mjs
      - name: Logs on failure
        if: failure()
        run: |
          cat /tmp/fake-taxagent.log || true
          cat /tmp/nexoffice-api.log || true
