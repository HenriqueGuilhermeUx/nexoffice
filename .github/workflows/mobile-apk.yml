name: Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-apk.yml'
      - 'package.json'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: https://api.nexoffices.com.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install mobile dependencies
        run: npm --prefix apps/mobile install
      - name: Typecheck mobile
        run: npm run mobile:typecheck
      - name: Generate Android project
        working-directory: apps/mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build standalone release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/NexOffice-Mobile-Executive-v0.2.0.apk
          sha256sum dist/NexOffice-Mobile-Executive-v0.2.0.apk > dist/NexOffice-Mobile-Executive-v0.2.0.sha256
          ls -lh dist/NexOffice-Mobile-Executive-v0.2.0.apk
          cat dist/NexOffice-Mobile-Executive-v0.2.0.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexOffice-Mobile-Executive-v0.2.0
          path: |
            dist/NexOffice-Mobile-Executive-v0.2.0.apk
            dist/NexOffice-Mobile-Executive-v0.2.0.sha256
          if-no-files-found: error
          retention-days: 14
