name: Founder Cockpit Growth Loop Smoke

on:
  pull_request:
    paths:
      - 'apps/api/src/business-founder-cockpit.ts'
      - 'apps/api/src/routes-founder-cockpit.ts'
      - 'apps/api/src/routes-business-intelligence.ts'
      - 'apps/api/src/business-intelligence-daily-engine.ts'
      - 'apps/web/src/FounderCockpit.tsx'
      - 'apps/web/src/founder-cockpit.css'
      - 'apps/web/src/ActivationJourneyTracker.tsx'
      - 'apps/web/src/main.tsx'
      - 'apps/web/public/adm/ativacao.*'
      - 'infra/postgres/027_founder_cockpit_growth_loop.sql'
      - 'scripts/smoke-founder-cockpit-growth-loop.mjs'
      - '.github/workflows/founder-cockpit-growth-loop-smoke.yml'

jobs:
  founder-growth-loop:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexoffice
          POSTGRES_USER: nexoffice
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexoffice -d nexoffice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexoffice@127.0.0.1:5432/nexoffice
      DATABASE_SSL: "false"
      AUTO_MIGRATE: "true"
      PORT: "4000"
      ALLOWED_ORIGINS: "*"
      WEB_APP_URL: http://localhost:5173
      NEXOFFICE_EXTERNAL_ACTIONS: "false"
      NEXOFFICE_INTELLIGENCE_DAILY_ENGINE: "false"
      NEXOFFICE_BILLING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build full workspace
        run: npm run build
      - name: Start isolated API with all migrations
        run: |
          node apps/api/dist/server.js > /tmp/nexoffice-founder.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexoffice-founder.log
          exit 1
      - name: Validate activation, first value, plan and cockpit
        run: node scripts/smoke-founder-cockpit-growth-loop.mjs
      - name: API logs on failure
        if: failure()
        run: cat /tmp/nexoffice-founder.log || true
