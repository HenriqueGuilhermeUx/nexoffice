name: TaxAgent Webhook Sync V1

on:
  pull_request:
    paths:
      - 'apps/api/src/routes-taxagent-webhooks.ts'
      - 'apps/api/src/integration-secret-crypto.ts'
      - 'apps/api/src/routes-standalone.ts'
      - 'infra/postgres/032_taxagent_webhook_sync.sql'
      - '.env.example'
      - 'docs/NEXOFFICE_EXECUTION_PLAN.md'
      - 'scripts/smoke-taxagent-webhook-sync-v1.mjs'
      - '.github/workflows/taxagent-webhook-sync-v1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/src/routes-taxagent-webhooks.ts'
      - 'apps/api/src/integration-secret-crypto.ts'
      - 'apps/api/src/routes-standalone.ts'
      - 'infra/postgres/032_taxagent_webhook_sync.sql'
      - '.env.example'
      - 'docs/NEXOFFICE_EXECUTION_PLAN.md'
      - 'scripts/smoke-taxagent-webhook-sync-v1.mjs'
      - '.github/workflows/taxagent-webhook-sync-v1.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build full NexOffice workspace
        run: npm run build
      - name: Validate signed TaxAgent webhook contract
        run: node scripts/smoke-taxagent-webhook-sync-v1.mjs
