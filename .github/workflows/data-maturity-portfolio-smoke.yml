name: Data Maturity Portfolio Smoke
on:
  pull_request:
    paths:
      - 'apps/web/public/adm/dados.*'
      - 'apps/web/public/adm/index.html'
      - 'apps/web/src/BusinessTrajectoryCenter.tsx'
      - 'apps/api/src/business-knowledge.ts'
      - 'apps/web/src/BusinessKnowledgeCenter.tsx'
      - 'docs/INTELLIGENT_ACTIVATION.md'
      - '.github/workflows/intelligent-activation-smoke.yml'
      - '.github/workflows/data-maturity-portfolio-smoke.yml'
jobs:
  data-maturity-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate admin JavaScript
        run: node --check apps/web/public/adm/dados.js
      - name: Install dependencies
        run: npm install
      - name: Build web and API
        run: npm run build
      - name: Guard activation contract
        run: |
          node -e "const fs=require('fs');const api=fs.readFileSync('apps/api/src/business-knowledge.ts','utf8');const web=fs.readFileSync('apps/web/src/BusinessKnowledgeCenter.tsx','utf8');if(!api.includes('buildActivation')||!web.includes('ATIVAÇÃO INTELIGENTE'))process.exit(1);"
