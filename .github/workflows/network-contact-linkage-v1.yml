name: Network Contact Linkage V1

on:
  pull_request:
    paths:
      - 'apps/api/src/routes-network-work-execution.ts'
      - 'apps/web/src/NetworkWorkLineage.tsx'
      - 'apps/web/src/network-work-lineage.css'
      - 'scripts/smoke-network-contact-linkage-v1.mjs'
      - '.github/workflows/network-contact-linkage-v1.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build full NexOffice workspace
        run: npm run build
      - name: Validate Network Contact Linkage V1
        run: node scripts/smoke-network-contact-linkage-v1.mjs
