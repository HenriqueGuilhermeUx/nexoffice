services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexoffice
      POSTGRES_USER: nexoffice
      POSTGRES_PASSWORD: nexoffice
    ports:
      - "5432:5432"
    volumes:
      - nexoffice_pg:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./infra/postgres/002_platform_foundation.sql:/docker-entrypoint-initdb.d/002-platform.sql:ro
      - ./infra/postgres/003_core_operational.sql:/docker-entrypoint-initdb.d/003-operational.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoffice -d nexoffice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexoffice_pg:
