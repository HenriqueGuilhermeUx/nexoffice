# USA-ONLY Netlify project; keep the Brazil deployments and root build untouched.
# Netlify Git integration: repository HenriqueGuilhermeUx/nexoffice,
# branch feature/nex-personal-usa-crypto-agentics-20261024
# Base directory: repository root (blank in Netlify settings)
# Package directory: sites/nex-personal-usa
[build]
  command = "npm ci && npm exec -- vite build --config sites/nex-personal-usa/vite.config.ts"
  publish = "sites/nex-personal-usa/dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; form-action 'self'; upgrade-insecure-requests"
